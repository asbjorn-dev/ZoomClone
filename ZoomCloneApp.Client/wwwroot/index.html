<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZoomCloneApp.Client</title>
    <base href="/" />

    <!-- CSS files - loader først, undgår FOUC (Flash of Unstyled Content) -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="ZoomCloneApp.Client.styles.css" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Third-party libraries -->
    <script src="https://sdk.twilio.com/js/video/releases/2.22.1/twilio-video.min.js"></script>

    <!-- Fluent UI scripts -->
    <script src="_content/Microsoft.FluentUI.AspNetCore.Components/Microsoft.FluentUI.AspNetCore.Components.lib.module.js" type="module" async></script>

    <!-- Custom scripts - load sidst så dependencies er klar -->
    <script src="_content/NetcodeHub.Packages.Components.Modal/modal.js"></script>
    <script src="js/twilio-video.js"></script>

    <!-- Blazor framework - SKAL loades først -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
